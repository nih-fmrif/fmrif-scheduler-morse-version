{% extends "page.html" %}
{% import "macros.html" as macros %}
{% block title %}{{title}}{% endblock %}
{% block body %}
	{% if no_entries %}
		<p class=none>{{ no_entries }}</p>
	{% else %}
		<form class=group-membership-add-form method=post action="{{ action }}">
			{{ macros.form(form)}}
			{{ macros.datalist("members", form.members, "invalid member") }}
			<form-submit><button type=submit data-confirm-title="Change PI" data-confirm-confirm="change PI">change</button></form-submit>
		</form>
	{% endif %}
{% endblock %}
