{% extends "base.html" %}
{% block basehead %}
	{% block head %}{% endblock %}
{% endblock %}
{% block basebody %}
	<nav aria-label=breadcrumb>
		<ul>
			{% for (name, url) in breadcrumb %}
				<li><a href="{{url}}"{% if request.path == url %} aria-current=page{% endif %}>{{name}}</a></li>
			{% endfor %}
		</ul>
	</nav>
	<main>{% block body %}{% endblock %}</main>
{% endblock %}
