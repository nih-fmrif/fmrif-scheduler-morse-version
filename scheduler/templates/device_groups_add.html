{% extends "page.html" %}
{% import "macros.html" as macros %}
{% block title %}{{title}}{% endblock %}
{% block body %}
	{% if none %}
		{{ none }}
	{% else %}
		<form class="device-groups-add-form" method=post action="{{ action }}">
			{{ macros.form(form)}}
			{{ macros.datalist("departments", form.departments, "invalid department") }}
			<button type=submit>add</button>
		</form>
	{% endif %}
{% endblock %}
