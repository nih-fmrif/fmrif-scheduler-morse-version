<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{% block title %}{% endblock %} - device scheduler</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='base.css') }}"
    />
  </head>
  <body>
    <div id="app-feedback" class="app-feedback" aria-live="polite"></div>
    <main id="main">{% block body %}{% endblock %}</main>
    <script
      type="module"
      src="{{ url_for('static', filename='js/notifications-bootstrap.js') }}"
    ></script>
  </body>
</html>
