<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{% block title %}{% endblock %} - device scheduler</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script
      nonce="{{ current_csp_nonce() }}"
      src="{{ static_asset_url('js/theme-init.js') }}"
    ></script>
    <link rel="stylesheet" href="{{ static_asset_url('base.css') }}" />
  </head>
  <body>
    <div id="app-feedback" class="app-feedback" aria-live="polite"></div>
    <main id="main">{% block body %}{% endblock %}</main>
    <script
      nonce="{{ current_csp_nonce() }}"
      type="module"
      src="{{ static_asset_url('js/notifications-bootstrap.js') }}"
    ></script>
  </body>
</html>
