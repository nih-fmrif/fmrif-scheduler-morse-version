{% extends "auth/base.html" %} {% block title %}Signing in{% endblock %} {%
block body %}
<div class="login-container">
  <h1>Signing you in…</h1>
  <p>Please wait while we finish signing you in.</p>
  <p>
    If you are not redirected automatically,
    <a href="{{ next_url }}">continue</a>.
  </p>
</div>
<script
  nonce="{{ current_csp_nonce() }}"
  id="auth-callback-next-url"
  type="application/json"
>
  {{ next_url|tojson }}
</script>
<script
  nonce="{{ current_csp_nonce() }}"
  src="{{ static_asset_url('js/auth-callback.js') }}"
></script>
{% endblock %}
