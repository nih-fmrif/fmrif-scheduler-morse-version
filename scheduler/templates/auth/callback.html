  <p>
    If you are not redirected automatically,
    <a href="{{ next_url }}">continue</a>.

</div>
<script id="auth-callback-next-url" type="application/json">

</script>
<script src="{{ url_for('static', filename='js/auth-callback.js') }}"></script>
{% endblock %}
