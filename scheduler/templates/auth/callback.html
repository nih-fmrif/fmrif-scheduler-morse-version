{% extends "auth/base.html" %}
{% block title %}Signing in{% endblock %}
{% block body %}
<div class="login-container">
  <h1>Signing you in…</h1>
  <p>Please wait while we finish signing you in.</p>
  <p>If you are not redirected automatically, <a href="{{ next_url }}">continue</a>.</p>
</div>
<script>
  window.location.replace({{ next_url|tojson }});
</script>
{% endblock %}
