# Used for developer purposes only
name: scheduler
services:
  postgres:
    container_name: scheduler-postgres
    image: postgres:15
    environment:
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
    ports:
      - "${PGPORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./sql:/sql
      - ./sql/000-init.sh:/docker-entrypoint-initdb.d/000-init.sh:ro
      - scheduler_pgdata:/var/lib/postgresql/data

  scheduler:
    container_name: scheduler
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "5051:5051"

    volumes:
      - ./scheduler:/app/scheduler
      - ./.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  scheduler_pgdata:
