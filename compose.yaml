x-service-platform: &service-platform
  linux/amd64

services:
  postgres:
    platform: *service-platform
    image: postgres:15
    environment:
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
    entrypoint:
      - /usr/local/bin/postgres-entrypoint.sh
    command:
      - postgres
    ports:
      - "${PGPORT:-5444}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 180s
    volumes:
      - ./sql:/sql
      - ./sql/000-init.sh:/docker-entrypoint-initdb.d/000-init.sh:ro
      - ./scripts/postgres-entrypoint.sh:/usr/local/bin/postgres-entrypoint.sh:ro
      - ${SCHEDULER_RUNTIME_ENV_FILE:-./.env}:/app/.env:ro
      - scheduler_pgdata:/var/lib/postgresql/data

  mailpit_app:
    platform: *service-platform
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT__PORT:-5445}:8025"
      - "${MAILPIT__SMTP_PORT:-5446}:1025"

  mailpit_unit:
    platform: *service-platform
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UNIT__PORT:-5465}:8025"
      - "${MAILPIT_UNIT__SMTP_PORT:-5466}:1025"

  mailpit_routes:
    platform: *service-platform
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_ROUTES__PORT:-5485}:8025"
      - "${MAILPIT_ROUTES__SMTP_PORT:-5486}:1025"

  mailpit_integration:
    platform: *service-platform
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_INTEGRATION__PORT:-5505}:8025"
      - "${MAILPIT_INTEGRATION__SMTP_PORT:-5506}:1025"

  scheduler:
    platform: *service-platform
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${SCHEDULER_COMPOSE_ENV_FILE:-.env}
    environment:
      PGHOST: postgres
      PGPORT: 5432
      APP_SERVER: gunicorn
      CONTAINER_APP_PORT: 5051
      SERVER__SERVER_NAME: ${SERVER__SERVER_NAME:-}
      MAIL__SERVER: mailpit_app
      MAIL__PORT: 1025
      MAIL__SUPPRESS_SEND: false
      MMSCHED_X_FORWARDED_FOR: 1
      MMSCHED_X_FORWARDED_PROTO: 1
      MMSCHED_X_FORWARDED_HOST: 1
    expose:
      - "5051"
    volumes:
      - ${SCHEDULER_RUNTIME_ENV_FILE:-./.env}:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      mailpit_app:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5051/auth/login >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  nginx:
    platform: *service-platform
    image: nginx:1.27-alpine
    depends_on:
      scheduler:
        condition: service_healthy
    ports:
      - "${APP_PORT:-5051}:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  scheduler_pgdata:
