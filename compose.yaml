# Used for developer purposes only
name: scheduler
services:
  postgres:
    container_name: scheduler-postgres
    image: postgres:15
    env_file:
      - sql/.env.docker
    ports:
      - "5050:5432" 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./sql:/sql
      - ./sql/000-run-migrations.sh:/docker-entrypoint-initdb.d/000-run-migrations.sh:ro
      - scheduler_pgdata:/var/lib/postgresql/data

  ldap:
    container_name: ldap
    image: bitnami/openldap:latest
    env_file:
      - .env.docker
    ports:
      - "1389:1389"

  scheduler:
    container_name: scheduler
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    ports:
      - "5051:5051"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scheduler:/app/scheduler
      - ./.env.docker:/app/.env:ro

volumes:
  scheduler_pgdata: