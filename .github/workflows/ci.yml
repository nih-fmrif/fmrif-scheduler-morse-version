name: CI
on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scheduler
        ports:
          - 5050:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
         python-version: '3.9'
    - name: Set up Node.js  
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-venv.txt
    - name: Install Node.js dependencies  
      run: npm ci --no-optional
    - name: Install Playwright browsers
      run: npx playwright install --with-deps
    - name: Create .env file
      run: |
        cat << EOF > .env
        SCHEDULER_SECRET_KEY=${{ secrets.SCHEDULER_SECRET_KEY }}
        SCHEDULER_SITE_SENDER=${{ secrets.SCHEDULER_SITE_SENDER }}
        SCHEDULER_LISTSERV=${{ secrets.SCHEDULER_LISTSERV }}
        SCHEDULER_SITEMINDER_PREFIX=${{ secrets.SCHEDULER_SITEMINDER_PREFIX }}
        SCHEDULER_NIH_NETWORKS=${{ secrets.SCHEDULER_NIH_NETWORKS }}
        MMSCHED_SUPERUSER_MODE=true
        MMSCHED_SERVER_NAME=127.0.0.1:5000
        MMSCHED_MAIL_USERNAME=${{ secrets.MMSCHED_MAIL_USERNAME }}
        MMSCHED_MAIL_PASSWORD=${{ secrets.MMSCHED_MAIL_PASSWORD }}
        MMSCHED_DB_URL=postgresql+psycopg2://postgres:postgres@localhost:5050/scheduler
        EOF
    - name: Initialize database
      run: |
        cd sql
        ./unsafe-reprovision-db.sh
      env:
        PGHOST: localhost
        PGPORT: 5050
        PGUSER: postgres
        PGPASSWORD: postgres
      continue-on-error: true
    - name: Start Flask server
      run: |
        cd scheduler
        FLASK_ENV=development flask run &
        sleep 5
    - name: Run Playwright tests
      run: npm run test
    - uses: actions/upload-artifact@v3
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
