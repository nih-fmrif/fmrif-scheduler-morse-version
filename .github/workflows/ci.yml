name: CI
on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - "5050:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
         python-version: '3.9'
    - name: Set up Node.js  
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: Setup environment
      run: |
        cp .env.sample .env
        echo "SCHEDULER_SECRET_KEY=${{ secrets.SCHEDULER_SECRET_KEY }}" >> .env
        echo "SCHEDULER_SITE_SENDER=${{ secrets.SCHEDULER_SITE_SENDER }}" >> .env
        echo "SCHEDULER_LISTSERV=${{ secrets.SCHEDULER_LISTSERV }}" >> .env
        echo "SCHEDULER_SITEMINDER_PREFIX=${{ secrets.SCHEDULER_SITEMINDER_PREFIX }}" >> .env
        echo "SCHEDULER_NIH_NETWORKS=${{ secrets.SCHEDULER_NIH_NETWORKS }}" >> .env
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-venv.txt
    - name: Install Node.js dependencies  
      run: npm ci --no-optional
    - name: Install Playwright browsers
      run: npx playwright install --with-deps
    - name: Initialize database
      run: |
        cd sql
        ./unsafe-reprovision-db.sh
      env:
        PGHOST: localhost
        PGPORT: 5050
        PGUSER: ${{ secrets.POSTGRES_USER }}
        PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    - name: Start Flask server
      run: |
        cd scheduler
        FLASK_ENV=development flask run &
        sleep 5
    - name: Run Playwright tests
      run: npm run test
    - uses: actions/upload-artifact@v3
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30