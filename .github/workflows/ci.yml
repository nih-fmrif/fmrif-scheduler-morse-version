# .github/workflows/ci.yml
name: CI
on:
  push:
    branches: [ '**' ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
         python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Python dependencies
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        uv sync --all-extras

    - name: Setup environment
      run: |
        bash setup-dotenv.sh
        docker compose up --build -d --wait

    - name: Run Python tests
      env:
        RBAC__SUPERUSER_MODE: "true"
      run: uv run pytest tests/python/

    - name: Install Node.js dependencies
      run: npm ci --no-optional

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v3
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      env:
        BASE_URL: "http://localhost:5051"
        RBAC__SUPERUSER_MODE: "true"
      run: |
        # Ensure clean state
        docker compose down

        # Setup environment files
        bash setup-dotenv.sh

        # Copy .env file to scheduler directory for container mounting
        cp .env scheduler/.env

        # Start fresh containers
        docker compose up -d --wait

        # Wait for services to be ready
        echo "Waiting for services to be ready..."
        sleep 30

        # Show container logs for debugging
        echo "=== Scheduler Container Logs ==="
        docker logs scheduler

        # Run tests
        npm run test

    # Update to v4 of upload-artifact
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pytest-report
        path: |
          .coverage
          coverage.xml
        retention-days: 30
