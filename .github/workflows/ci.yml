name: CI
on:
  push:
    branches: ['**']

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      AUTH_TEST__ENABLED: "true"
      AUTH_TEST__SHARED_SECRET: "ci-shared-secret"
      FMRIF_COMPOSE_WRAPPER: "run-compose.sh"

    steps:
      - uses: actions/checkout@v3

      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Verify pixi
        run: pixi --version

      - name: Run XSS sink guardrails
        run: bash scripts/check-no-unsafe-html-sinks.sh

      - name: Setup environment and services
        run: |
          bash setup-dotenv.sh --profile compose
          {
            echo "AUTH_TEST__ENABLED=true"
            echo "AUTH_TEST__SHARED_SECRET=ci-shared-secret"
          } >> .env
          bash run-compose.sh --no-app

      - name: Run Python unit tests
        run: pixi run test-unit

      - name: Run Python route tests
        run: pixi run test-routes-xdist

      - name: Export coverage XML
        run: pixi run -e dev python -m coverage xml -o coverage.xml

      - name: Install Node.js dependencies
        run: pixi run install-js

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pixi run install-playwright

      - name: Run Playwright integration tests
        env:
          PLAYWRIGHT_AUTH_MODE: "mock"
        run: pixi run test-integration-ci

      - name: Teardown services
        if: always()
        run: bash run-compose.sh --clear

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: |
            .coverage
            coverage.xml
          retention-days: 30

  debian-runtime-smoke:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        debian_version: ["13.1"]
    steps:
      - uses: actions/checkout@v3

      - name: Setup environment
        run: bash setup-dotenv.sh --profile compose

      - name: Run Debian runtime smoke
        env:
          DEBIAN_VERSION: ${{ matrix.debian_version }}
        run: bash scripts/run-debian-runtime-smoke.sh "${DEBIAN_VERSION}"

  debian-runtime-integration:
    timeout-minutes: 75
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        debian_version: ["13.1"]

    steps:
      - uses: actions/checkout@v3

      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Verify pixi
        run: pixi --version

      - name: Setup environment
        run: bash setup-dotenv.sh --profile compose

      - name: Install Node.js dependencies
        run: pixi run install-js

      - name: Cache Playwright browsers
        id: playwright-cache-debian
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-debian-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-debian-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache-debian.outputs.cache-hit != 'true'
        run: pixi run install-playwright

      - name: Run Debian runtime integration
        env:
          DEBIAN_VERSION: ${{ matrix.debian_version }}
        run: pixi run test-debian-integration
