# .github/workflows/ci.yml
name: CI
on:
  push:
    branches: [ '**' ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install pixi
      run: |
        curl -fsSL https://pixi.sh/install.sh | bash
        echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

    - name: Verify pixi
      run: pixi --version

    - name: Setup environment
      run: |
        bash setup-dotenv.sh
        {
          echo "AUTH_TEST__ENABLED=true"
          echo "AUTH_TEST__SHARED_SECRET=ci-shared-secret"
        } >> .env
        docker compose up --build -d --wait

    - name: Run Python unit tests
      env:
        AUTH_TEST__ENABLED: "true"
        AUTH_TEST__SHARED_SECRET: "ci-shared-secret"
      run: pixi run test-unit

    - name: Install Node.js dependencies
      run: pixi run install-js

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v3
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: pixi run install-playwright

    - name: Run Playwright integration tests
      env:
        BASE_URL: "http://localhost:5051"
        PLAYWRIGHT_AUTH_MODE: "mock"
        AUTH_TEST__ENABLED: "true"
        AUTH_TEST__SHARED_SECRET: "ci-shared-secret"
      run: |
        # Ensure clean state
        docker compose down

        # Setup environment files
        bash setup-dotenv.sh
        {
          echo "AUTH_TEST__ENABLED=true"
          echo "AUTH_TEST__SHARED_SECRET=ci-shared-secret"
        } >> .env

        # Copy .env file to scheduler directory for container mounting
        cp .env scheduler/.env

        # Start fresh containers
        docker compose up -d --wait

        # Wait for services to be ready
        echo "Waiting for services to be ready..."
        sleep 30

        # Show container logs for debugging
        echo "=== Scheduler Container Logs ==="
        docker compose logs scheduler

        # Run tests
        pixi run test-integration-ci

    # Update to v4 of upload-artifact
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pytest-report
        path: |
          .coverage
          coverage.xml
        retention-days: 30
