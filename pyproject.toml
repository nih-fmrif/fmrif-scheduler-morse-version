[project]
name = "scheduler"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.7"
dependencies = [
    "blinker==1.9.0",
    "cachelib==0.13.0",
    "click==8.1.7",
    "erd==0.0.1",
    "Flask==2.0.2",
    "Flask-Mail==0.10.0",
    "Flask-Session==0.4.1",
    "Flask-SQLAlchemy==2.5.1",
    "Flask-WTF==1.2.2",
    "greenlet==3.1.1",
    "itsdangerous==2.2.0",
    "Jinja2==3.1.4",
    "MarkupSafe==3.0.2",
    "psycopg2-binary==2.9.10",
    "python-dotenv==1.0.1",
    "SQLAlchemy==1.4.26",
    "Werkzeug==2.0.2",
    "WTForms==3.2.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "ldap3==2.9.1",
    "alembic>=1.13.1",
]


[build-system]
requires = ["setuptools>=42", "wheel", "setuptools_scm[toml]>=3.4"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["."]