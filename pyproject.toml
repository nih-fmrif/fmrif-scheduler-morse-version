[project]
name = "scheduler"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "blinker==1.9.0",
    "cachelib==0.13.0",
    "click==8.1.8",
    "erd==0.0.1",
    "Flask==3.1.1",
    "Flask-Mail==0.9.1",
    "Flask-Session==0.8.0",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-WTF==1.2.2",
    "greenlet==3.1.1",
    "itsdangerous==2.2.0",
    "Jinja2==3.1.6",
    "MarkupSafe==3.0.2",
    "psycopg2-binary==2.9.10",
    "python-dotenv==1.1.1",
    "SQLAlchemy==2.0.40",
    "Werkzeug==3.1.3",
    "WTForms==3.2.1",
    "email-validator==2.2.0",
    "alembic>=1.13.1",
    "PyJWT[crypto]==2.10.1",
    "requests==2.32.5",
]

[project.optional-dependencies]
dev = [
    "gunicorn>=23,<24",
    "ipython>=8.31.0",
    "locust>=2.31,<3",
    "pdbpp>=0.10.3",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.5.0",
    "pytest>=8.3.4",
    "pre-commit>=4.1.0",
]


[build-system]
requires = ["setuptools>=42", "wheel", "setuptools_scm[toml]>=3.4"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["."]

[tool.alembic]
script_location = "migrations"
version_locations = "migrations/versions"
ini_file = "migrations/alembic.ini"
