[project]
name = "scheduler"
version = "0.1.0"
description = "NIH MRI Center scheduler"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = "3.11.*"
nodejs = "18.*"

[pypi-dependencies]
scheduler = { path = ".", editable = true, extras = ["dev"] }

[tasks]
serve = "bash scripts/serve.sh"
serve-gunicorn = "APP_SERVER=gunicorn bash scripts/serve.sh"
install-js = "npm ci --no-optional"
install-playwright = "npx playwright install --with-deps"
pre-commit-install = "pre-commit install"
pre-commit = "pre-commit run --all-files"
test-unit = "python3 scripts/run-target-aware-pytest-suite.py unit tests/unit \"not route\""
test-routes = "python3 scripts/run-target-aware-pytest-suite.py routes tests/unit route"
install-browsers = "playwright install chromium"
test-integration = "bash scripts/run-isolated-test-suite.sh integration python3 scripts/run-integration-playwright.py --grep-invert=@heavy"
test-integration-headed = "bash scripts/run-isolated-test-suite.sh integration -- python3 scripts/run-integration-playwright.py --headed --grep-invert=@heavy"
test-integration-ci = "bash scripts/run-isolated-test-suite.sh integration -- python3 scripts/run-integration-playwright.py --reporter=dot --grep-invert=@heavy"
test-integration-heavy = "PLAYWRIGHT_HEAVY_CONCURRENCY=6 bash scripts/run-isolated-test-suite.sh integration -- python3 scripts/run-integration-playwright.py --project=chromium --reporter=dot --workers=1 --grep=@heavy"
test-load-moderate = "bash scripts/run-isolated-test-suite.sh integration -- python3 scripts/run-locust-load.py"
test-load-moderate-scheduler = "LOAD_PROFILE=scheduler bash scripts/run-isolated-test-suite.sh integration -- python3 scripts/run-locust-load.py"
test-load-moderate-notify = "LOAD_PROFILE=notify bash scripts/run-isolated-test-suite.sh integration -- python3 scripts/run-locust-load.py"
test-old-bootstrap-compat = "bash scripts/run-old-bootstrap-compat.sh"
test-auth-flow-credentials = "env -u PLAYWRIGHT_STORAGE_STATE PLAYWRIGHT_AUTH_MODE=entra npx playwright test tests/playwright/auth-flow/oauth.spec.ts --workers=1"
test-auth-flow-storage-state = "bash -c 'PLAYWRIGHT_AUTH_MODE=entra PLAYWRIGHT_STORAGE_STATE=\"${PLAYWRIGHT_STORAGE_STATE:-./playwright-auth.${FMRIF_RUNTIME_SCOPE:-default}.json}\" npx playwright test tests/playwright/auth-flow/oauth.spec.ts --workers=1'"
generate-auth-storage-state = "bash -c 'PLAYWRIGHT_AUTH_MODE=entra PLAYWRIGHT_STORAGE_STATE=\"${PLAYWRIGHT_STORAGE_STATE:-./playwright-auth.${FMRIF_RUNTIME_SCOPE:-default}.json}\" npx playwright test tests/playwright/auth-flow/auth-storage.spec.ts --headed --workers=1'"
test-live-incident = "PLAYWRIGHT_AUTH_MODE=entra npx playwright test tests/playwright/live-incident --workers=1 --pass-with-no-tests"
