[project]
name = "scheduler"
version = "0.1.0"
description = "NIH MRI Center scheduler"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = "3.11.*"
nodejs = "18.*"

[pypi-dependencies]
scheduler = { path = ".", editable = true, extras = ["dev"] }

[tasks]
serve = "flask run --host 0.0.0.0 --port 5051"
install-js = "npm ci --no-optional"
install-playwright = "npx playwright install --with-deps"
pre-commit-install = "pre-commit install"
pre-commit = "pre-commit run --all-files"
test-unit = "pytest tests/unit -m \"not route\""
test-routes = "pytest tests/unit -m route"
install-browsers = "playwright install chromium"
test-integration = "npx playwright test tests/playwright/integration"
test-integration-headed = "npx playwright test tests/playwright/integration --headed"
test-integration-ci = "npx playwright test tests/playwright/integration --reporter=dot"
test-auth-flow-credentials = "env -u PLAYWRIGHT_STORAGE_STATE PLAYWRIGHT_AUTH_MODE=entra npx playwright test tests/playwright/integration tests/playwright/auth-flow/oauth.spec.ts --workers=1"
test-auth-flow-storage-state = "bash -lc 'PLAYWRIGHT_AUTH_MODE=entra PLAYWRIGHT_STORAGE_STATE=\"${PLAYWRIGHT_STORAGE_STATE:-./playwright-auth.json}\" npx playwright test tests/playwright/integration tests/playwright/auth-flow/oauth.spec.ts --workers=1'"
generate-auth-storage-state = "bash -lc 'PLAYWRIGHT_AUTH_MODE=entra PLAYWRIGHT_STORAGE_STATE=\"${PLAYWRIGHT_STORAGE_STATE:-./playwright-auth.json}\" npx playwright test tests/playwright/auth-flow/auth-storage.spec.ts --headed --workers=1'"
test-live-incident = "PLAYWRIGHT_AUTH_MODE=entra npx playwright test tests/playwright/live-incident --workers=1"
